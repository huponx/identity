application:
  ingress:
    enabled: true
    host: auth.example.com
    tls: true
    tlsSecretName: auth-example-tls
  secrets:
    - name: POSTGRES_PASSWORD
      secretName: identity-postgres
      key: password
    - name: REDIS_PASSWORD
      secretName: redis-local-credentials
      key: password
    - name: IDENTITY_MFA_KEY
      secretName: identity-mfa-key
      key: keys
  config:
    data:
      IDENTITY_ISSUER: https://auth.example.com
      IDENTITY_SIGNING_KEY_ID: k1
      POSTGRES_HOST: postgres.infrastructure.svc.cluster.local
      REDIS_HOST: redis.infrastructure.svc.cluster.local
setup:
  enabled: true
  job:
    container:
      env:
        - name: POSTGRES_HOST
          value: postgres.infrastructure.svc.cluster.local
        - name: POSTGRES_DB
          value: data
        - name: POSTGRES_USER
          value: data-user-rw
        - name: SETUP_CONFIG
          value: >-
            {"admin":{"email":"admin@example.com"},
            "clients":[{"id":"gatekeeper","type":"confidential","resource":"gatekeeper","secret_env":"GATEKEEPER_CLIENT_SECRET",
            "redirect_uris":["https://api.example.com/auth/callback"],"post_logout_uris":["https://admin.example.com/","https://example.com/"],
            "grants":["authorization_code","refresh_token","client_credentials","urn:ietf:params:oauth:grant-type:token-exchange"]}],
            "exchange_policies":[{"client":"gatekeeper","audience":"identity","max_depth":1}]}
  secrets:
    - name: POSTGRES_PASSWORD
      secretName: identity-postgres
      key: password
    - name: SETUP_ADMIN_PASSWORD
      secretName: identity-admin
      key: password
    - name: GATEKEEPER_CLIENT_SECRET
      secretName: gatekeeper-client
      key: secret
