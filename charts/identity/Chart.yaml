apiVersion: v2
name: identity
description: Identity (OAuth 2.0 / OpenID Connect provider, JWT, RBAC, token exchange, MFA), deployed with the go-application chart.
type: application
# Replaced at release time (update-chart-metadata): version and appVersion carry the release version.
version: 0.0.0
appVersion: "0.0.0"
dependencies:
  - name: go-application
    version: 1.3.0
    repository: oci://ghcr.io/huponx/charts
    alias: application
  # The initial setup Job (first admin, clients, exchange policies). Off by default: mm-deploy turns it
  # on (setup.enabled) for the first rollout and removes it afterwards.
  - name: go-job
    version: 1.1.0
    repository: oci://ghcr.io/huponx/charts
    alias: setup
    condition: setup.enabled
